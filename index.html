<link rel="manifest" href="manifest.webmanifest">

<style>
:root{--ink:#0e2a3b;--mute:#58717f;--card:rgba(255,255,255,.88);--line:rgba(14,42,59,.12);--acc:#0b7bd0;--acc2:#12c2a8;--warn:#d9480f;--s1:#2d8fe3;--s2:#bfe5fa;--sh:0 10px 28px rgba(8,50,95,.18)}
html[data-theme=dark],body[data-sky=night]{--ink:#e8f2fa;--mute:#9db6c8;--card:rgba(13,31,50,.84);--line:rgba(255,255,255,.14);--sh:0 10px 28px rgba(0,0,0,.4)}
body[data-sky=pcloud]{--s1:#4f9de0;--s2:#d3e8f6}body[data-sky=cloud]{--s1:#667d93;--s2:#c9d4de}body[data-sky=rain]{--s1:#42586d;--s2:#9fb2c3}body[data-sky=night]{--s1:#091428;--s2:#1c4a7a}
html[data-theme=dark] body{--s1:#091428;--s2:#16385f}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;color:var(--ink);background:linear-gradient(180deg,var(--s1),var(--s2)) fixed;font:16px/1.5 "Segoe UI","Noto Sans Arabic",Tahoma,system-ui,sans-serif;padding-bottom:env(safe-area-inset-bottom,0px)}
.top{position:sticky;top:0;z-index:50;display:flex;justify-content:space-between;align-items:center;gap:8px;padding:10px 14px;padding-top:calc(10px + env(safe-area-inset-top,0px));background:rgba(8,40,72,.4);backdrop-filter:blur(14px);color:#fff}
.brand{display:flex;align-items:center;gap:8px}.tools{display:flex;align-items:center;gap:8px}
h1{font-size:1.2rem;margin:0;font-weight:800}
.logo{font-size:1.8rem;display:inline-block;animation:float 4s ease-in-out infinite}
.lg{display:flex;gap:4px}
.lg button,.ic{background:rgba(255,255,255,.18);color:#fff;border:1px solid rgba(255,255,255,.4);border-radius:999px;padding:5px 10px;font-weight:700}
.lg button[aria-pressed=true]{background:#fff;color:#0b4f86}
.wrap{max-width:980px;margin:0 auto;padding:12px 14px 24px}
.sub,.ft{color:rgba(255,255,255,.92);margin:4px 0 10px;text-shadow:0 1px 6px rgba(0,0,0,.25)}
button,input{font:inherit;color:var(--ink);background:var(--card);border:1px solid var(--line);border-radius:999px;padding:8px 14px}
button{cursor:pointer;transition:transform .15s,box-shadow .15s}button:hover{transform:translateY(-1px)}
button:focus-visible,input:focus-visible,a:focus-visible{outline:3px solid var(--acc2);outline-offset:2px}
button[aria-pressed=true]{background:linear-gradient(135deg,var(--acc),var(--acc2));color:#fff;border-color:transparent}
.row{display:flex;gap:6px;overflow-x:auto;padding:6px 0}.row button{flex:none;white-space:nowrap}
.search{display:flex;gap:6px}.search input{flex:1;min-width:0}
section{background:var(--card);backdrop-filter:blur(10px);border:1px solid var(--line);border-radius:22px;padding:16px;margin:14px 0;box-shadow:var(--sh);animation:up .6s both;scroll-margin-top:70px}
h2{font-size:1.08rem;margin:0 0 10px;font-weight:800}
h2::before{content:"";display:inline-block;width:6px;height:1em;border-radius:3px;background:linear-gradient(var(--acc),var(--acc2));margin-inline-end:8px;vertical-align:-2px}
.hero{position:relative;overflow:hidden;color:#fff;background:linear-gradient(135deg,rgba(6,58,108,.55),rgba(6,58,108,.22));border-color:rgba(255,255,255,.35);padding:20px}
.hero button{background:rgba(255,255,255,.2);color:#fff;border-color:rgba(255,255,255,.45)}
.hz{position:relative;z-index:1}.hrow{display:flex;justify-content:space-between;align-items:center;gap:10px}
.pl{font-size:1.15rem;font-weight:700}.hc{font-size:1.05rem;opacity:.95}
.big{font-size:5rem;font-weight:800;line-height:1;text-shadow:0 4px 18px rgba(0,0,0,.25)}
.hicon{font-size:4.8rem;animation:float 4s ease-in-out infinite}
.hs{opacity:.95;margin-top:6px}.hf{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-top:10px;font-size:.85rem;flex-wrap:wrap}
#fx{position:absolute;inset:0;pointer-events:none;overflow:hidden}
#fx i{position:absolute;top:-10%;width:2px;height:16px;background:linear-gradient(transparent,#d6ebff);animation:drop 1s linear infinite}
#fx u{position:absolute;top:-40px;right:-30px;width:170px;height:170px;border-radius:50%;background:radial-gradient(circle,#fff0a0 0,#ffbf33 38%,rgba(255,191,51,0) 70%);animation:pulse 4s ease-in-out infinite}
#fx b{position:absolute;left:-15%;font-size:3rem;opacity:.5;animation:drift linear infinite}
#fx s{position:absolute;width:3px;height:3px;border-radius:50%;background:#fff;animation:tw 3s ease-in-out infinite}
@keyframes drop{to{transform:translateY(420px)}}@keyframes pulse{50%{transform:scale(1.15);opacity:.8}}
@keyframes drift{to{transform:translateX(130vw)}}@keyframes tw{50%{opacity:.15}}
@keyframes float{50%{transform:translateY(-8px)}}@keyframes up{from{opacity:0;transform:translateY(16px)}}
.mute{color:var(--mute);font-size:.85rem}
.models{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:6px}
.models label{display:flex;gap:8px;align-items:flex-start;padding:8px 10px;border:1px solid var(--line);border-radius:14px;cursor:pointer}
.models i{width:12px;height:12px;border-radius:50%;margin-top:6px;flex:none}
.models b{display:block;font-size:.95rem}.models span{color:var(--mute);font-size:.8rem}
.tabs{display:flex;gap:6px;margin-bottom:8px;flex-wrap:wrap}
.scroll{overflow-x:auto}
#chart,#map{direction:ltr}#chart{display:block;width:100%;height:auto}
.ar svg{width:26px;height:26px;display:block}
table{border-collapse:collapse;width:100%;min-width:560px;font-size:.9rem}
td,th{padding:6px;border-bottom:1px solid var(--line);text-align:center}
th:first-child,td:first-child{text-align:start}th{font-weight:400;color:var(--mute)}
.status{padding:10px 14px;border-radius:14px;border-left:5px solid var(--warn);background:var(--card);margin:10px 0}
.dcards{display:grid;grid-template-columns:repeat(7,minmax(84px,1fr));gap:8px;overflow-x:auto;padding:4px 2px}
.dc{text-align:center;padding:10px 4px;border-radius:18px}
.dc .i{font-size:1.9rem;display:block}.dc .hi{font-weight:800}.dc small{display:block;opacity:.85}
.per{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.per div{border:1px solid var(--line);border-radius:16px;padding:10px;text-align:center}.per .i{font-size:1.6rem}
#outlook p{margin:6px 0;max-width:70ch}
#map{height:400px;border-radius:16px;z-index:0}
.ar{display:flex;flex-direction:column;align-items:center;font:700 11px sans-serif;color:#0d2a3a;text-shadow:0 0 3px #fff,0 0 3px #fff}
.alr{border:1px solid var(--line);border-left:5px solid #d99a00;background:transparent;border-radius:12px;padding:8px 12px;margin:6px 0}
.alr.l2{border-left-color:var(--warn)}
#ov{position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:90}
#drawer{position:fixed;top:0;bottom:0;left:0;width:min(330px,86vw);z-index:100;background:linear-gradient(180deg,#14507f,#0c2f55);color:#fff;padding:calc(14px + env(safe-area-inset-top,0px)) 14px 20px;transform:translateX(-105%);transition:transform .3s;overflow:auto;box-shadow:0 0 40px rgba(0,0,0,.45)}
html[dir=rtl] #drawer{left:auto;right:0;transform:translateX(105%)}
#drawer.open,html[dir=rtl] #drawer.open{transform:none}
.dh{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px;font-size:1.25rem;font-weight:800}
#dx{background:none!important;border:0!important;color:#fff;font-size:1.8rem;padding:4px 10px}
#drawer nav a{display:flex;align-items:center;gap:14px;padding:13px 12px;color:#fff;text-decoration:none;border-radius:14px;font-size:1.08rem}
#drawer nav a.on{background:rgba(255,255,255,.2);font-weight:700}
#drawer nav i{font-style:normal;width:28px;text-align:center;font-size:1.3rem}
#drawer hr{border:0;border-top:1px solid rgba(255,255,255,.22);margin:12px 6px}
#drawer h3{margin:14px 6px 8px;font-size:.8rem;color:rgba(255,255,255,.7);text-transform:uppercase;letter-spacing:.05em}
#drawer .seg{padding:0 6px}
#drawer button:not(#dx){background:rgba(255,255,255,.14);color:#fff;border-color:rgba(255,255,255,.3)}
#drawer button[aria-pressed=true]:not(#dx){background:#fff;color:#0c3b66}
.seg{display:flex;gap:6px;flex-wrap:wrap}
#seac table,#agric table{min-width:0;font-size:.8rem}#seac td,#seac th,#agric td,#agric th{padding:6px 3px}
.hours{display:flex;gap:8px;overflow-x:auto;padding:4px 2px}
.hr{flex:none;min-width:66px;text-align:center;padding:8px 4px;border:1px solid var(--line);border-radius:16px}
.hr .i{font-size:1.6rem}.hr small{display:block;color:var(--mute)}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>

 <div class="dh"><span>⛅ <span data-x="app"></span></span><button id="dx" aria-label="Close">✕</button></div>

<div class="wrap">
<p class="sub" data-x="sub"></p>
<div class="search"><input id="q" data-p="ph" aria-label="Search"><button id="go" data-x="go"></button><button id="loc" data-x="loc"></button></div>

<div class="row" id="favs"></div>
<section class="hero"><div id="fx"></div><div class="hz">
 <div class="hrow"><div><div id="place" class="pl"></div><div class="big" id="temp">–</div><div id="hcond" class="hc"></div></div><div class="hicon" id="hicon">⛅</div></div>
 <div id="sub" class="hs"></div>

<div id="status"></div>
<section id="s-alerts"><h2 data-x="a_h"></h2><div id="alerts"></div><p class="mute" data-x="a_n"></p></section>

 <div class="tabs" id="btabs"><button data-b="osm" aria-pressed="true" data-x="b_osm"></button><button data-b="sat" aria-pressed="false" data-x="b_sat"></button></div>
 <div id="map" role="application" aria-label="Map"></div><p class="mute" id="mnote" data-x="map_n"></p></section>
<section id="s-sea"><h2 data-x="n_sea"></h2><div class="scroll" id="seac"></div><p class="mute" data-x="sea_n"></p></section>
<section id="s-agri"><h2 data-x="n_agri"></h2><div class="scroll" id="agric"></div><p class="mute" data-x="ag_note"></p></section>

<section><div class="tabs" id="tabs"></div><div class="scroll"><svg id="chart" viewBox="0 0 800 300" role="img" aria-label="Chart"></svg></div></section>
<section><h2 data-x="tbl_h"></h2><div class="scroll"><table id="table"></table></div></section>
<p class="ft" data-x="foot"></p>
</div>

function chart(){
 const ss=series(tab),t=data.hourly.time,n=t.length,W=Math.max(320,Math.round($("chart").parentElement.clientWidth||800)),H=280,L=40,R=10,T=14,B=34;
 const ys=ss.map(s=>{if(tab!=="precipitation")return s.y;let a=0;return s.y.map(x=>a+=x||0)});
 const all=ys.flat().filter(x=>x!=null);let mn=Math.min(...all),mx=Math.max(...all);
 if(tab==="precipitation")mn=0;else if(tab==="cloud_cover"){mn=0;mx=100}else{mn=Math.floor(mn-1);mx=Math.ceil(mx+1)}
 if(mx===mn)mx=mn+1;
 const tk=ticks(mn,mx);mn=tk[0];mx=tk[tk.length-1];$("chart").setAttribute("viewBox",`0 0 ${W} ${H}`);
 const X=i=>L+i*(W-L-R)/(n-1),Y=v=>T+(mx-v)/(mx-mn)*(H-T-B);
 let g="";
 for(const v of tk){g+=`<line x1="${L}" x2="${W-R}" y1="${Y(v)}" y2="${Y(v)}" stroke="var(--line)"/><text x="${L-6}" y="${Y(v)+4}" text-anchor="end" font-size="11" fill="var(--mute)">${Math.round(v*10)/10}</text>`}
 t.forEach((s,i)=>{if(s.endsWith("T00:00")){g+=`<line x1="${X(i)}" x2="${X(i)}" y1="${T}" y2="${H-B}" stroke="var(--line)"/><text x="${X(i)+(W-L-R)/n*12}" y="${H-12}" text-anchor="middle" font-size="11" fill="var(--mute)">${new Date(s).toLocaleDateString(LC(),{weekday:"short"}).replace(".","")}</text>`}});
 ss.forEach((s,k)=>{const pts=ys[k].map((v,i)=>v==null?null:X(i)+","+Y(v)).filter(Boolean).join(" ");
  g+=`<polyline fill="none" stroke="${s.c[3]}" stroke-width="2" stroke-linejoin="round" points="${pts}"/>`});
 $("chart").innerHTML=g;
}

function alerts(){
 if(!data)return;
 const ts=data.hourly.time,ds=[...new Set(ts.map(x=>x.slice(0,10)))].slice(0,7),G={};
 const nm=d=>new Date(d).toLocaleDateString(LC(),{weekday:"long"});
 const ss=series("temperature_2m"),ws=series("wind_speed_10m"),gs=series("wind_gusts_10m"),dr=series("wind_direction_10m");
 const A=(q,i)=>{const a=q.map(z=>z.y[i]).filter(x=>x!=null);return a.length?av(a):null};
 const D=i=>{const a=dr.map(z=>z.y[i]).filter(x=>x!=null);if(!a.length)return null;return (Math.atan2(av(a.map(v=>Math.sin(v*Math.PI/180))),av(a.map(v=>Math.cos(v*Math.PI/180))))*180/Math.PI+360)%360};
 const add=(l,ic,ti,d,tx)=>{(G[ti]=G[ti]||{l:0,ic,r:[]});G[ti].l=Math.max(G[ti].l,l);G[ti].r.push(nm(d)+" ("+tx+")")};
 ds.forEach(d=>{
  const idx=ts.map((x,i)=>x.startsWith(d)?i:-1).filter(i=>i>=0),T=idx.map(i=>A(ss,i)).filter(x=>x!=null),K=idx.map(i=>A(gs,i)).filter(x=>x!=null);
  if(T.length){const hi=mx(T),lo=mi(T);
   if(hi>=38)add(2,"🔥",t("al_hh"),d,Math.round(hi)+"°");else if(hi>=35)add(1,"🌡️",t("al_h"),d,Math.round(hi)+"°");
   if(lo<=3)add(1,"🥶",t("al_c"),d,Math.round(lo)+"°");
   if(idx.some(i=>{const a=A(ss,i),w=A(ws,i),k=D(i);return a>=33&&w>=20&&k!=null&&k>=135&&k<=250}))add(2,"🏜️",t("al_s"),d,t("al_sd"));
  }
  if(K.length&&mx(K)>=60)add(mx(K)>=80?2:1,"💨",t("al_w"),d,t("al_g",Math.round(mx(K))));
  const P=agg("precipitation",idx,sum);
  if(P>=20)add(2,"⛈️",t("al_pp"),d,Math.round(P)+" mm");else if(P>=10)add(1,"🌧️",t("al_p"),d,Math.round(P)+" mm");
  if(waves[d]>=2.5)add(waves[d]>=4?2:1,"🌊",t("al_sea"),d,t("al_v",waves[d].toFixed(1)));
 });

}

$("star").onclick=()=>{let l=favs();l=isFav()?l.filter(f=>!(f.name===place.name&&f.lat===place.lat)):[...l,place];sv("mt_favs",l);drawFavs()};
$("loc").onclick=()=>{if(!navigator.geolocation){$("hits").innerHTML='<span class="mute">'+t("geo_na")+'</span>';return}
 navigator.geolocation.getCurrentPosition(p=>pick(t("loc"),Math.round(p.coords.latitude*100)/100,Math.round(p.coords.longitude*100)/100),()=>{$("hits").innerHTML='<span class="mute">'+t("geo_no")+'</span>'})};

// Résumé d'un jour : moyenne des modèles cochés
const IC=(c,p,w)=>p>=5?["🌧️","c0"]:p>=1?["🌦️","c1"]:c>70?["☁️","c2"]:c>40?["⛅","c3"]:c>15?["🌤️","c4"]:w>40?["🌬️","c5"]:["☀️","c6"];
function agg(v,idx,f){const ss=series(v),out=ss.map(s=>{const a=idx.map(i=>s.y[i]).filter(x=>x!=null);return a.length?f(a):null}).filter(x=>x!=null);return out.length?out.reduce((a,b)=>a+b,0)/out.length:null}
const sum=a=>a.reduce((x,y)=>x+y,0),mx=a=>Math.max(...a),mi=a=>Math.min(...a),av=a=>sum(a)/a.length;
function dayInfo(d,part){
 const t=data.hourly.time,idx=t.map((s,i)=>s.startsWith(d)&&(!part||(+s.slice(11,13)>=part[0]&&+s.slice(11,13)<part[1]))?i:-1).filter(i=>i>=0);
 const hi=agg("temperature_2m",idx,mx),lo=agg("temperature_2m",idx,mi),p=agg("precipitation",idx,sum),w=agg("wind_speed_10m",idx,mx),c=agg("cloud_cover",idx,av);
 return {d,hi,lo,p:p||0,w:w||0,c:c||0,ic:IC(c||0,p||0,w||0),n:idx.length};
}
let selDay=0;
function days(){
 const ds=[...new Set(data.hourly.time.map(s=>s.slice(0,10)))].slice(0,7),info=ds.map(d=>dayInfo(d));
 if(selDay>=info.length)selDay=0;
 $("dcards").innerHTML=info.map((x,i)=>`<button class="dc" data-i="${i}" aria-pressed="${i===selDay}"><small>${new Date(x.d).toLocaleDateString(LC(),{weekday:"short",day:"numeric"})}</small><span class="i">${x.ic[0]}</span><span class="hi">${Math.round(x.hi)}°</span><small>${Math.round(x.lo)}°</small><small>${x.p>=0.2?x.p.toFixed(1)+" mm":t("dry")}</small></button>`).join("");
 const x=info[selDay],P=[["p0",0,6],["p1",6,12],["p2",12,18],["p3",18,24]];
 $("dday").innerHTML=`<p>${t("daysum","<b>"+new Date(x.d).toLocaleDateString(LC(),{weekday:"long",day:"numeric",month:"long"})+"</b>",t(x.ic[1]).toLowerCase(),Math.round(x.lo),Math.round(x.hi),Math.round(x.w),x.p>=0.2?t("rain_t",x.p.toFixed(1)):t("norain"))}</p><div class="per">`+P.map(q=>{const y=dayInfo(x.d,[q[1],q[2]]);return y.n?`<div><b>${t(q[0])}</b><div class="i">${y.ic[0]}</div>${Math.round((y.hi+y.lo)/2)}°<div class="mute">${y.p>=0.2?y.p.toFixed(1)+" mm":t("dry")} · ${Math.round(y.w)} km/h</div></div>`:""}).join("")+"</div>";
 // tendance
 const h=info.map(i=>i.hi),first=av(h.slice(0,3)),last=av(h.slice(3)),dl=last-first,wet=info.filter(i=>i.p>=1),hot=info.reduce((a,b)=>b.hi>a.hi?b:a),cold=info.reduce((a,b)=>b.hi<a.hi?b:a),wind=info.reduce((a,b)=>b.w>a.w?b:a);
 const nm=i=>new Date(i.d).toLocaleDateString(LC(),{weekday:"long"});
 let o=`<p>${Math.abs(dl)<1.5?t("o_st"):dl>0?t("o_up",Math.round(dl)):t("o_dn",Math.round(-dl))}</p>`;
 o+=`<p>${wet.length?t("o_rain",wet.map(i=>nm(i)+" ("+i.p.toFixed(1)+" mm)").join(", ")):t("o_dry")}</p>`;
 o+=`<p>${t("o_ext",nm(hot),Math.round(hot.hi),nm(cold),Math.round(cold.hi),nm(wind),Math.round(wind.w))}</p>`;
 const sp=ds.map(d=>{const v=series("temperature_2m").map(s=>{const a=data.hourly.time.map((t,i)=>t.startsWith(d)?s.y[i]:null).filter(z=>z!=null);return a.length?mx(a):null}).filter(z=>z!=null);return v.length>1?mx(v)-mi(v):0});
 o+=`<p class="mute">${sel.size<2?t("o_f0"):sp.slice(-3).some(z=>z>4)?t("o_f1"):t("o_f2")}</p>`;
 $("outlook").innerHTML=o;
}
$("dcards").onclick=e=>{const b=e.target.closest("[data-i]");if(b){selDay=+b.dataset.i;days()}};
function drawModels(){$("models").innerHTML=MODELS.map(m=>`<label><input type="checkbox" value="${m[0]}" ${sel.has(m[0])?"checked":""}><i style="background:${m[3]}"></i><div><b>${m[1]}</b><span>${m[2][LI()]}</span></div></label>`).join("")}
$("models").onchange=e=>{e.target.checked?sel.add(e.target.value):sel.delete(e.target.value);load()};
function drawTabs(){$("tabs").innerHTML=Object.entries(VARS).map(([k,v])=>`<button data-k="${k}" aria-pressed="${k===tab}">${t(v[0])}</button>`).join("")}
$("tabs").onclick=e=>{const k=e.target.dataset.k;if(!k)return;tab=k;
 [...$("tabs").children].forEach(b=>b.setAttribute("aria-pressed",b.dataset.k===k));if(data)chart()};
$("go").onclick=async()=>{const q=$("q").value.trim();if(!q)return;
 try{const r=await fetch("https://geocoding-api.open-meteo.com/v1/search?count=6&language="+L+"&name="+encodeURIComponent(q));
  const d=await r.json();$("hits").innerHTML=(d.results||[]).map((x,i)=>`<button data-i="${i}">${x.name}, ${x.country||""}</button>`).join("")||'<span class="mute">'+t("nores")+'</span>';
  $("hits").onclick=e=>{const x=d.results[e.target.dataset.i];if(x){pick(x.name,x.latitude,x.longitude);$("hits").innerHTML=""}};
 }catch(e){$("hits").innerHTML='<span class="mute">'+t("serr")+'</span>'}};
$("q").onkeydown=e=>{if(e.key==="Enter")$("go").click()};

let map,wl,rl,mm="wind",tm,bases,bm=ld("mt_base")==="sat"?"sat":"osm";
function mapUpdate(){
 if(!window.L){$("mnote").textContent=t("mn_off");return}
 if(!map){map=L.map("map").setView([place.lat,place.lon],7);
  bases={osm:L.tileLayer("https://tile.openstreetmap.org/{z}/{x}/{y}.png",{maxZoom:12,attribution:"© OpenStreetMap"}),sat:L.tileLayer("https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}",{maxZoom:12,attribution:"Imagery © Esri"})};
  bases[bm].addTo(map);bTabs();
  wl=L.layerGroup().addTo(map);
  map.on("moveend",()=>{clearTimeout(tm);tm=setTimeout(()=>{if(mm==="wind")wind()},400)});
  map.on("click",e=>{const a=+e.latlng.lat.toFixed(2),b=+e.latlng.lng.toFixed(2);pick(t("point")+" "+a+", "+b,a,b)});
 }else map.setView([place.lat,place.lon],map.getZoom());
 setM(mm);
}
function setM(m){mm=m;
 [...$("mtabs").children].forEach(b=>b.setAttribute("aria-pressed",b.dataset.m===m));
 wl.clearLayers();if(rl){map.removeLayer(rl);rl=null}
 if(m==="wind")wind();else if(m==="rain")radar();else clouds();
}
$("mtabs").onclick=e=>{const m=e.target.dataset.m;if(m&&map)setM(m)};
async function wind(){
 const b=map.getBounds(),N=6,M=5,la=[],lo=[];
 for(let i=0;i<M;i++)for(let j=0;j<N;j++){la.push((b.getSouth()+(i+.5)*(b.getNorth()-b.getSouth())/M).toFixed(2));lo.push((b.getWest()+(j+.5)*(b.getEast()-b.getWest())/N).toFixed(2))}
 try{
  const r=await fetch(`https://api.open-meteo.com/v1/forecast?latitude=${la}&longitude=${lo}&current=wind_speed_10m,wind_direction_10m&timezone=auto`);
  const d=await r.json();wl.clearLayers();
  (Array.isArray(d)?d:[d]).forEach(p=>{const v=p.current.wind_speed_10m,dir=p.current.wind_direction_10m,c=v<15?"#2e86de":v<30?"#1b9e77":v<45?"#d99a00":"#c4410c";
   wl.addLayer(L.marker([p.latitude,p.longitude],{interactive:false,icon:L.divIcon({className:"",iconSize:[40,40],iconAnchor:[20,20],
    html:`<div class="ar"><svg width="26" height="26" viewBox="0 0 24 24" style="transform:rotate(${dir+180}deg)"><path d="M12 2 L19 20 L12 16 L5 20 Z" fill="${c}" stroke="#fff" stroke-width="1.5"/></svg>${Math.round(v)}</div>`})}))});
  $("mnote").textContent=t("mn_w");
 }catch(e){$("mnote").textContent=t("mn_we")}
}
function bTabs(){[...$("btabs").children].forEach(b=>b.setAttribute("aria-pressed",b.dataset.b===bm))}
$("btabs").onclick=e=>{const b=e.target.dataset.b;if(!b||!map||b===bm)return;map.removeLayer(bases[bm]);bm=b;bases[bm].addTo(map).bringToBack();sv("mt_base",bm);bTabs()};
async function clouds(){
 try{
  const d=await (await fetch("https://api.rainviewer.com/public/weather-maps.json")).json(),a=d.satellite.infrared,f=a[a.length-1];
  rl=L.tileLayer(d.host+f.path+"/256/{z}/{x}/{y}/0/0_0.png",{opacity:.7,maxNativeZoom:6,maxZoom:12}).addTo(map);
  $("mnote").textContent=t("mn_c",new Date(f.time*1000).toLocaleTimeString(LC(),{hour:"2-digit",minute:"2-digit"}));
 }catch(e){$("mnote").textContent=t("mn_ce")}
}
async function radar(){
 try{
  const d=await (await fetch("https://api.rainviewer.com/public/weather-maps.json")).json(),f=d.radar.past[d.radar.past.length-1];
  rl=L.tileLayer(d.host+f.path+"/256/{z}/{x}/{y}/2/1_1.png",{opacity:.65,maxNativeZoom:7,maxZoom:12}).addTo(map);
  $("mnote").textContent=t("mn_r",new Date(f.time*1000).toLocaleTimeString(LC(),{hour:"2-digit",minute:"2-digit"}));
 }catch(e){$("mnote").textContent=t("mn_re")}
}
if("serviceWorker" in navigator)addEventListener("load",()=>navigator.serviceWorker.register("sw.js").catch(()=>{}));
setLang(L);load();
</script>
